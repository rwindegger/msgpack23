# This starter workflow is for a CMake project running on multiple platforms. There is a different starter workflow if you just want a single platform.
# See: https://github.com/actions/starter-workflows/blob/main/ci/cmake-single-platform.yml
name: CMake on multiple platforms
permissions:
  contents: read

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      # Set fail-fast to false to ensure that feedback is delivered for all matrix combinations. Consider changing this to true when your workflow is stable.
      fail-fast: false

      # Set up a matrix to run the following 6 configurations:
      # 1. <Windows x64, latest MSVC compiler toolchain on the default runner image, default generator>
      # 2. <Linux x64, latest GCC compiler toolchain on the default runner image, default generator>
      # 3. <Linux x64, latest Clang compiler toolchain on the default runner image, default generator>
      # 4. <Linux arm64, latest GCC compiler toolchain on the default runner image, default generator>
      # 5. <Linux arm64, latest Clang compiler toolchain on the default runner image, default generator>
      # 6. <macOS arm64, AppleClang compiler toolchain on the default runner image, default generator>
      #
      # macOS builds with AppleClang only. Homebrew GCC cannot compile against the macOS 26 SDK, whose
      # <mach/message.h> uses xnu_static_assert_struct_size() macros that GCC fails to parse. Every
      # Homebrew GCC (12, 14, 15) is affected and the runner image ships no older SDK to fall back on,
      # so macos-latest + gcc is excluded rather than worked around. Linux arm64 covers GCC/libstdc++
      # on a non-x86_64 target instead.
      #
      # Every configuration is built once per entry in the build_type list.
      # To add more build types (Release, Debug, RelWithDebInfo, etc.) customize the build_type list.
      matrix:
        os: [ ubuntu-latest, ubuntu-24.04-arm, windows-latest, macos-latest ]
        build_type: [ Release, Debug ]
        c_compiler: [ gcc, clang, cl ]
        include:
          - os: windows-latest
            c_compiler: cl
            cpp_compiler: cl
          - os: ubuntu-latest
            c_compiler: gcc
            cpp_compiler: g++
          - os: ubuntu-latest
            c_compiler: clang
            cpp_compiler: clang++
          - os: ubuntu-24.04-arm
            c_compiler: gcc
            cpp_compiler: g++
          - os: ubuntu-24.04-arm
            c_compiler: clang
            cpp_compiler: clang++
          - os: macos-latest
            c_compiler: clang
            cpp_compiler: clang++
        exclude:
          - os: windows-latest
            c_compiler: gcc
          - os: windows-latest
            c_compiler: clang
          - os: ubuntu-latest
            c_compiler: cl
          - os: ubuntu-24.04-arm
            c_compiler: cl
          - os: macos-latest
            c_compiler: gcc
          - os: macos-latest
            c_compiler: cl

    steps:
      - uses: actions/checkout@v6

      - name: Set reusable strings
        # Turn repeated input strings (such as the build output directory) into step outputs. These step outputs can be used throughout the workflow file.
        id: strings
        shell: bash
        run: |
          echo "build-output-dir=${{ github.workspace }}/build" >> "$GITHUB_OUTPUT"

      - name: Configure CMake
        # Configure CMake in a 'build' subdirectory. `CMAKE_BUILD_TYPE` is only required if you are using a single-configuration generator such as make.
        # See https://cmake.org/cmake/help/latest/variable/CMAKE_BUILD_TYPE.html?highlight=cmake_build_type
        run: >
               cmake -B ${{ steps.strings.outputs.build-output-dir }}
               -DCMAKE_CXX_COMPILER=${{ matrix.cpp_compiler }}
               -DCMAKE_C_COMPILER=${{ matrix.c_compiler }}
               -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
               -S ${{ github.workspace }}

      - name: Build
        # Build your program with the given configuration. Note that --config is needed because the default Windows generator is a multi-config generator (Visual Studio generator).
        run: cmake --build ${{ steps.strings.outputs.build-output-dir }} --config ${{ matrix.build_type }}

      - name: Test
        working-directory: ${{ steps.strings.outputs.build-output-dir }}
        # Execute tests defined by the CMake configuration. Note that --build-config is needed because the default Windows generator is a multi-config generator (Visual Studio generator).
        # See https://cmake.org/cmake/help/latest/manual/ctest.1.html for more detail
        run: ctest --build-config ${{ matrix.build_type }}

      - name: Setup covdbg
        if: matrix.os == 'windows-latest' && matrix.build_type == 'Debug'
        uses: covdbg/setup-covdbg@v0
        with:
          version: 'latest'

      - name: Run Coverage
        if: matrix.os == 'windows-latest' && matrix.build_type == 'Debug'
        shell: pwsh
        run: |
          covdbg --fetch-license --config .covdbg.yaml --output ${{ steps.strings.outputs.build-output-dir }}\tests\${{ matrix.build_type }}\msgpack23_tests.covdb ${{ steps.strings.outputs.build-output-dir }}\tests\${{ matrix.build_type }}\msgpack23_tests.exe
          covdbg convert --format LCOV --input ${{ steps.strings.outputs.build-output-dir }}\tests\${{ matrix.build_type }}\msgpack23_tests.covdb --output ${{ steps.strings.outputs.build-output-dir }}\tests\${{ matrix.build_type }}\msgpack23_tests.lcov

      - name: Upload coverage reports to Codecov
        if: matrix.os == 'windows-latest' && matrix.build_type == 'Debug'
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
